# main にマージされた *.gs を Apps Script へ自動反映する（手作業の貼り直しを無くすため）
# 設定手順: docs/gas-auto-deploy.md
name: GAS deploy

on:
  push:
    branches: [main]
    paths:
      - '*.gs'
      - 'scripts/gas-deploy.sh'
      - '.github/workflows/gas-deploy.yml'
  # 初回設定の確認や、失敗後の再実行用
  workflow_dispatch:
    inputs:
      skip_drift_check:
        description: 'ずれ検知を省略する（GAS 側にしかない変更は消える）'
        type: boolean
        default: false

# 連続マージで push が前後しないよう、1 本ずつ順に流す
concurrency:
  group: gas-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ずれ検知で前回のコミットと比べるため履歴を取る
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 壊れたコードを本番に流さないよう、反映前に lint / format を通す
      - run: npm run check

      - name: clasp の認証情報を配置
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::secret CLASPRC_JSON が未設定です（docs/gas-auto-deploy.md）"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Apps Script へ反映
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_WEBAPP_DEPLOYMENT_ID: ${{ vars.GAS_WEBAPP_DEPLOYMENT_ID }}
          # push: マージ前の main。手動実行: 1 つ前のコミット（失敗後の再実行で使う）
          GAS_BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'HEAD^' }}
          GAS_SKIP_DRIFT_CHECK: ${{ inputs.skip_drift_check && 'true' || 'false' }}
        run: bash scripts/gas-deploy.sh
