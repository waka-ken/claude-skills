# 対象リポジトリへコピーするワークフロー
# 配置先: .github/workflows/notion-ai-task.yml
#
# 必要 Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  - Claude Code (Pro/Max) の OAuth トークン
#                              生成: `claude setup-token`
#   NOTION_TOKEN             - Notion 書き戻し用インテグレーション
#
# トリガー: GAS からの repository_dispatch (event_type: notion-ai-task)
#
# 注意: CI は無人実行のため permission-mode は bypassPermissions を使う。
#       （承認プロンプト待ちでターンを浪費させない）

name: Notion AI Task Pipeline

on:
  repository_dispatch:
    types: [notion-ai-task]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  NOTION_PAGE_ID: ${{ github.event.client_payload.notion_page_id }}
  TASK_TITLE: ${{ github.event.client_payload.title }}
  TASK_BACKGROUND: ${{ github.event.client_payload.background }}
  TASK_TODO: ${{ github.event.client_payload.todo }}
  TASK_DONE: ${{ github.event.client_payload.done_criteria }}
  TASK_BODY: ${{ github.event.client_payload.body_markdown }}
  DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}

jobs:
  design:
    name: Phase1 Design (.ai_todo.md)
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Branch name
        id: meta
        run: |
          SHORT="${DISPATCH_ID:-manual}"
          SHORT="${SHORT:0:8}"
          echo "branch=ai/notion-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Create working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.meta.outputs.branch }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate .ai_todo.md via Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is required" >&2
            exit 1
          fi

          npm install -g @anthropic-ai/claude-code

          # head で打ち切ると find が SIGPIPE になり pipefail で落ちるため || true
          TREE=$(find . -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.ai_todo.md' \
            | head -n 200 | sed 's|^./||' || true)

          PROMPT=$(cat <<EOF
          あなたはシニアエンジニアです。以下の Notion タスクを、このリポジトリ向けの具体的な実装手順書に翻訳してください。

          【重要・無人CI制約】
          - これは対話セッションではない。ユーザー承認・確認・許可待ちは禁止。
          - ツール（Write / Edit / Bash 等）は一切使わないこと。
          - ファイルを作成・編集しようとしないこと。
          - 返答は標準出力への Markdown 本文のみ。前置き・後書き・コードフェンス不要。

          # タスクタイトル
          ${TASK_TITLE}

          # 背景
          ${TASK_BACKGROUND}

          # やること
          ${TASK_TODO}

          # 完了条件
          ${TASK_DONE}

          # 本文（参考）
          ${TASK_BODY}

          # リポジトリファイル一覧（一部）
          ${TREE}

          # 出力フォーマット（厳守）
          ## ゴール
          ## 変更対象ファイル
          ## 手順（チェックリスト）
          ## テスト
          ## 完了条件
          EOF
          )

          # -p: 非対話 / bypassPermissions: 承認待ちを発生させない
          # （万一ツールを呼んでも許可待ちで止まらない）
          claude -p "$PROMPT" \
            --output-format text \
            --permission-mode bypassPermissions \
            --max-turns 8 \
            > .ai_todo.md

          if [ ! -s .ai_todo.md ]; then
            echo "Failed to generate .ai_todo.md (empty)" >&2
            exit 1
          fi

          # 承認待ち文言や必須見出し欠落は不正成果物として失敗させる
          if grep -Eqi '承認待ち|許可をお願い|書き込み許可|waiting for.*(approval|permission)|user approval' .ai_todo.md; then
            echo "Invalid .ai_todo.md: looks like an approval prompt" >&2
            cat .ai_todo.md >&2
            exit 1
          fi
          for h in '## ゴール' '## 変更対象ファイル' '## 手順' '## テスト' '## 完了条件'; do
            if ! grep -q "$h" .ai_todo.md; then
              echo "Invalid .ai_todo.md: missing heading: $h" >&2
              head -n 80 .ai_todo.md >&2
              exit 1
            fi
          done

          echo "----- .ai_todo.md -----"
          head -n 40 .ai_todo.md

      - name: Commit design doc
        run: |
          git add .ai_todo.md
          git commit -m "docs(ai): add .ai_todo.md for Notion task ${DISPATCH_ID}"
          git push -u origin HEAD

      - name: Notion → AI実装中
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "${NOTION_TOKEN:-}" ] || [ -z "${NOTION_PAGE_ID:-}" ]; then
            echo "Skip Notion update (missing secrets/page_id)"
            exit 0
          fi
          curl -sS -X PATCH "https://api.notion.com/v1/pages/${NOTION_PAGE_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties":{"AIステータス":{"select":{"name":"AI実装中"}}}}'

  implement:
    name: Phase2 Implement + PR
    needs: design
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.design.outputs.branch }}

      - name: Claude Code implement from .ai_todo.md
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ github.event.repository.default_branch }}
          branch_prefix: "ai/notion-"
          prompt: |
            REPO: ${{ github.repository }}
            NOTION_PAGE_ID: ${{ env.NOTION_PAGE_ID }}
            DISPATCH_ID: ${{ env.DISPATCH_ID }}

            【重要・無人CI制約】
            - ユーザー承認・確認ダイアログは出ない前提で進めること。
            - ファイル編集・テスト実行・git/gh 操作はすべて自動実行してよい。
            - 「許可を待っています」等の返答は禁止。実装して Draft PR まで完了させる。

            リポジトリ直下の `.ai_todo.md` を唯一の手順書として扱い、記載どおりに実装してください。
            - `.ai_todo.md` の順番を守り、範囲外の変更はしない
            - テストがあれば実行し、失敗したら修正して再実行
            - 完了後、変更をコミットし Draft PR を作成する
            - PR タイトルは Notion タスク「${{ env.TASK_TITLE }}」を含める
            - PR 本文に Notion page id `${{ env.NOTION_PAGE_ID }}` と `.ai_todo.md` への言及を入れる
          claude_args: |
            --max-turns 60
            --permission-mode bypassPermissions

      - name: Find PR URL
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ needs.design.outputs.branch }}"
          URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' || true)
          if [ -z "$URL" ]; then
            URL=$(gh pr list --state open --limit 5 --json url,headRefName \
              --jq ".[] | select(.headRefName|startswith(\"ai/notion\")) | .url" | head -n1 || true)
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "PR_URL=${URL}"

      - name: Notion → PR作成済
        if: success() && steps.pr.outputs.url != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          curl -sS -X PATCH "https://api.notion.com/v1/pages/${NOTION_PAGE_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg url "$PR_URL" '{
              properties: {
                "AIステータス": { select: { name: "PR作成済" } },
                "PR URL": { url: $url },
                "AI最終エラー": { rich_text: [] }
              }
            }')"

      - name: Notion → AI失敗
        if: failure()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          MSG="GitHub Actions implement failed. run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X PATCH "https://api.notion.com/v1/pages/${NOTION_PAGE_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg msg "$MSG" '{
              properties: {
                "AIステータス": { select: { name: "AI失敗" } },
                "AI最終エラー": { rich_text: [{ type: "text", text: { content: $msg } }] }
              }
            }')"
