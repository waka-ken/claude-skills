# プロジェクト名を固定する。Dev Container（Reopen in Container）と docker compose の両方から
# 同じコンテナ・同じボリュームを使い、Claude の認証や拡張を共有するため
name: claude-skills

services:
  claude-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: claude-skills-dev:latest
    container_name: claude-skills-dev
    volumes:
      - .:/workspace
      - claude-config:/home/node/.claude
      # gh auth login の結果を再ビルド後も残す
      - gh-config:/home/node/.config/gh
      # エディタ拡張（Claude Code 拡張など）を再ビルド後も残し、毎回のインストールを不要にする
      - vscode-extensions:/home/node/.vscode-server/extensions
      - cursor-extensions:/home/node/.cursor-server/extensions
      - ${HOME}/.ssh:/home/node/.ssh
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    stdin_open: true
    tty: true
    working_dir: /workspace
    user: node

volumes:
  claude-config:
  gh-config:
  vscode-extensions:
  cursor-extensions:
