services:
  claude-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      # 拡張機能 (Git Graph / Claude Code) は Dockerfile ビルド時に同梱される
    image: claude-skills-dev:latest
    container_name: claude-skills-dev
    volumes:
      - .:/workspace
      - claude-config:/home/node/.claude
      - ${HOME}/.ssh:/home/node/.ssh
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    stdin_open: true
    tty: true
    working_dir: /workspace
    user: node

volumes:
  claude-config:
